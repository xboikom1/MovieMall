<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MovieMall</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/tailwind.config.js"></script>
  </head>
  <body class="min-h-screen bg-bg text-text">
    <header class="border-b border-[#374151] bg-[#111827] shadow-[0_14px_36px_rgba(0,0,0,.35)]">
      <div class="mx-auto flex max-w-7xl items-center justify-between gap-3 px-4 py-4 phones:px-6">
        <div class="flex items-center gap-3 phones:gap-6">
          <a
            href="index.html"
            class="flex items-center rounded-xl bg-rose px-4 py-2 text-base phones:text-lg font-semibold text-white"
            >MovieMall</a
          >
          <nav class="tablets:flex hidden gap-2 text-sm">
            <a
              href="movies.html"
              class="rounded-lg border border-[#374151] bg-[#1f2937] px-4 py-2 text-text transition hover:bg-rose"
              >Movies</a
            >
            <a
              href="souvenirs.html"
              class="rounded-lg border border-[#374151] bg-[#1f2937] px-4 py-2 text-text transition hover:bg-rose"
              >Souvenirs</a
            >
          </nav>
        </div>
        <div class="flex items-center gap-2 phones:gap-4 text-xs phones:text-sm">
          <span class="hidden text-[#9ca3af] tablets:inline">Already have an account?</span>
          <a
            href="login.html"
            class="rounded-lg bg-rose px-3 phones:px-5 py-2 font-semibold text-white transition hover:brightness-110"
            >Sign In</a
          >
        </div>
      </div>
    </header>

    <main
      class="mx-auto flex min-h-[calc(100vh-76px)] max-w-7xl items-center justify-center px-4 py-8 phones:px-6 phones:py-10 tablets:py-14"
    >
      <section
        class="w-full max-w-xl rounded-3xl border border-[#374151] bg-[#111827] p-5 phones:p-7 tablets:max-w-2xl tablets:p-10 shadow-[0_14px_36px_rgba(0,0,0,.35)]"
      >
        <h1
          class="mb-6 phones:mb-8 text-2xl phones:text-3xl tablets:text-4xl font-bold tracking-tight text-text"
        >
          Create your account
        </h1>
        <form class="mx-auto flex max-w-xl flex-col gap-4 phones:gap-5 tablets:gap-6">
          <label class="sr-only" for="register-name">Full Name</label>
          <input
            id="register-name"
            type="text"
            placeholder="Full Name"
            class="w-full rounded-xl border border-[#374151] bg-[#1f2937] px-4 phones:px-5 py-3.5 phones:py-4 text-base phones:text-lg text-text outline-none placeholder:text-[#9ca3af] focus:border-rose focus:ring-2 focus:ring-rose/30"
          />

          <label class="sr-only" for="register-email">Email</label>
          <input
            id="register-email"
            type="email"
            placeholder="Email"
            class="w-full rounded-xl border border-[#374151] bg-[#1f2937] px-4 phones:px-5 py-3.5 phones:py-4 text-base phones:text-lg text-text outline-none placeholder:text-[#9ca3af] focus:border-rose focus:ring-2 focus:ring-rose/30"
          />

          <label class="sr-only" for="register-password">Password</label>
          <input
            id="register-password"
            type="password"
            placeholder="Password"
            class="w-full rounded-xl border border-[#374151] bg-[#1f2937] px-4 phones:px-5 py-3.5 phones:py-4 text-base phones:text-lg text-text outline-none placeholder:text-[#9ca3af] focus:border-rose focus:ring-2 focus:ring-rose/30"
          />

          <button
            type="button"
            class="mt-2 w-full rounded-xl bg-rose px-6 py-3.5 phones:py-4 text-base phones:text-lg tablets:text-xl font-semibold text-white shadow-[0_14px_36px_rgba(0,0,0,.35)] transition hover:brightness-110"
          >
            Register
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
